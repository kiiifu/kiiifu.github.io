<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Работа 6. Калькулятор стоимости услуги</title>
    <link rel="stylesheet" href="style.css">
    <script src="calculator.js" defer></script>
</head>
<body>
    <main class="calculator">
        <h1>Калькулятор стоимости услуги</h1>

        <div class="field">
            <label for="quantity">Количество:</label>
            <input type="text" id="quantity" name="quantity" inputmode="numeric" autocomplete="off" value="1">
            <p id="error" class="error" role="alert"></p>
        </div>

        <fieldset class="field">
            <legend>Тип услуги:</legend>
            <div class="radio-row">
                <input type="radio" id="type-basic" name="service" value="basic" checked>
                <label for="type-basic">Базовый — 1 000 ₽</label>
            </div>
            <div class="radio-row">
                <input type="radio" id="type-standard" name="service" value="standard">
                <label for="type-standard">Стандарт — 1 500 ₽</label>
            </div>
            <div class="radio-row">
                <input type="radio" id="type-premium" name="service" value="premium">
                <label for="type-premium">Премиум — 2 500 ₽</label>
            </div>
        </fieldset>

        <div class="field" id="options-group" hidden>
            <label for="option">Срок выполнения:</label>
            <select id="option" name="option">
                <option value="0">Обычный (+0 ₽)</option>
                <option value="500">Срочный (+500 ₽)</option>
                <option value="1200">Экспресс (+1 200 ₽)</option>
            </select>
        </div>

        <div class="field" id="property-group" hidden>
            <input type="checkbox" id="property" name="property" value="700">
            <label for="property" class="inline-label">Расширенная гарантия (+700 ₽)</label>
        </div>

        <p id="result" class="result" aria-live="polite"></p>
    </main>
</body>
</html>
