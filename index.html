<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Работа 5. Калькулятор стоимости заказа</title>
    <link rel="stylesheet" href="style.css">
    <script src="calculator.js" defer></script>
</head>
<body>
    <main class="calculator">
        <h1>Калькулятор стоимости заказа</h1>

        <div class="field">
            <label for="product">Товар:</label>
            <select id="product" name="product">
                <option value="5300">Клавиатура — 5 300 ₽</option>
                <option value="3990">Мышь — 3 990 ₽</option>
                <option value="20000">Монитор — 20 000 ₽</option>
                <option value="10599">Наушники — 10 599 ₽</option>
            </select>
        </div>

        <div class="field">
            <label for="quantity">Количество:</label>
            <input type="text" id="quantity" name="quantity" inputmode="numeric" autocomplete="off" value="1">
            <p id="error" class="error" role="alert"></p>
        </div>

        <button type="button" id="calc-button">Посчитать стоимость</button>

        <p id="result" class="result" aria-live="polite"></p>
    </main>
</body>
</html>
